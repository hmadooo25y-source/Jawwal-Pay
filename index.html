<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,viewport-fit=cover">
<meta name="theme-color" content="#f0f4fb">
<title>محاكاة خدمة USSD</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#1881ee;--bg:#f0f4fb;--ink:#1f1f1f;--green:#1e8e3e;--dial:#ecedf4}
html,body{margin:0;width:100%;height:100%;font-family:"Google Sans Text","Google Sans",Roboto,"Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input{font:inherit}
.phone{position:absolute;top:0;left:0;width:360px;height:800px;transform-origin:0 0;background:var(--bg);overflow:hidden}
/* contacts */
.contacts{position:absolute;top:0;left:12px;right:12px;bottom:var(--nav,80px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.contacts::-webkit-scrollbar{display:none}
.suggested{flex:0 0 auto;margin:39px 0 10px;height:24px;line-height:24px;padding-right:21px;font-size:14px;color:#2462a5;text-align:right}
.contact{flex:0 0 auto;height:72px;background:#fff;border-radius:4px;display:flex;align-items:center;gap:16px;padding:0 16px 0 28px;direction:rtl;cursor:pointer}
.contact:nth-child(2){border-radius:20px 20px 4px 4px}.contact:last-child{border-radius:4px 4px 20px 20px}.contact:nth-child(2):last-child{border-radius:20px}
.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:#79d68e;display:grid;place-items:center;font-size:20px;color:#174d2b}
.contact-info{flex:1;text-align:right;min-width:0}
.contact-name{font-size:16px;line-height:24px;color:#1f1f1f;white-space:nowrap}
.contact-phone{font-size:14px;line-height:20px;color:#444746;white-space:nowrap}
.num-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.phone-icon{width:24px;height:24px;flex:0 0 24px;order:2}
.empty{padding:20px;text-align:center;color:#666}
/* dial area */
.dial-area{position:absolute;left:0;right:0;bottom:0;height:510px;background:var(--dial);border-radius:24px 24px 0 0;padding:0 8px}
.display{height:54px;margin-bottom:16.5px;display:flex;align-items:center;direction:rtl}
.erase{flex:0 0 auto;border:0;background:transparent;padding:0;margin-right:9.5px;width:26px;height:26px;display:grid;place-items:center}
#dial{flex:1;min-width:0;background:transparent;border:0;outline:0;text-align:center;font-size:30px;color:#171717;direction:ltr;padding:0}
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:65px;border:0;border-radius:33px;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0;box-shadow:none}
.key .num{font-family:Roboto,Arial,sans-serif;font-size:32px;line-height:32px}
.key small{font-family:Roboto,Arial,sans-serif;font-size:13px;line-height:13px;height:13px;color:#3b3b3b;margin-top:6px;display:flex;align-items:center}
.call{display:flex;align-items:center;justify-content:center;gap:15px;direction:rtl;margin:16px auto 0;width:101px;height:54px;border:0;border-radius:27px;background:var(--green);color:#fff;font-size:16px;padding:0}
.nav{position:absolute;bottom:0;height:var(--nav,80px);left:0;right:0;display:flex;align-items:center;justify-content:space-around;color:#555;background:var(--dial)}
.nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.nav .nav-icon{font-size:24px;color:#42464c}.nav .active{color:#2d7ba6}.nav .active .nav-icon{background:#c8eaff;border-radius:30px;padding:2px 22px}
.nav span{font-size:14px;opacity:.8}
.view-home .dial-area{display:none}.view-home .nav{background:var(--bg)}.view-dial .contacts{pointer-events:none}
/* overlay + sheets */
.scrim{position:absolute;inset:0;background:#0000004d;display:none;z-index:4}
.scrim.show{display:block}
.sheet{position:absolute;z-index:5;bottom:var(--kb,0px);left:0;right:0;background:#fff;border-radius:24px 24px 0 0;padding:28px 27px 40px;display:none}
.sheet.show{display:block}
.sheet h2{font-size:16px;line-height:25.5px;font-weight:400;text-align:center;margin:0 0 18px;color:#000}
.message{font-size:16px;line-height:25.5px;text-align:right;white-space:pre-line;color:#414141;min-height:25px;margin-bottom:22px}
.ussd-input{width:100%;height:56px;border:2px solid var(--blue);border-radius:28px;background:#f0f0f0;outline:0;text-align:right;padding:0 18px;font-size:18px;direction:ltr;margin-bottom:18px}
.actions{display:flex;gap:12px;direction:ltr}
.actions button{height:46px;border:0;border-radius:23px;flex:1;font-size:16px}
.send{background:var(--blue);color:#fff}.cancel{background:#f0f0f0;color:#333}
.hint{font-size:12px;text-align:center;color:#6b6b6b;margin-top:12px}
/* loading sheet: top 665.5, ring 26 */
#loading{display:none;align-items:center;gap:10px;padding:0 15px 0 0;height:87px;font-size:17px;color:#222;direction:rtl;border-bottom:1px solid #e5e5e5}
.sheet.busy{padding:30px 15px 48px!important}
.sheet.busy>*:not(#loading){display:none!important}.sheet.busy #loading{display:flex;padding-bottom:31px;height:58px;font-size:16px}
.spin{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:3.5px solid #333;position:relative}
.spin:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#333}
@keyframes pl{50%{opacity:.4}}
/* final sheet: top 553.5 */
.sheet.final{padding:28px 27px 77px!important}
.sheet.final h2{margin:0 0 18px}
.sheet.final .message{text-align:center;min-height:0;margin:0 0 26px}
.sheet.final .hint{display:none}
.sheet.final .actions{margin:0}.sheet.final .cancel{background:var(--blue);color:#fff;height:46px;font-size:16px;border-radius:23px}
/* شاشة المكالمة */
.callscreen{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:6;direction:rtl}
.callscreen.show{display:flex}
.cs-top{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:92px}
.cs-status{font-size:15px;color:#3c4043;margin-bottom:16px}
.cs-number{font-size:36px;color:#1f1f1f;direction:ltr;margin-bottom:9px;font-weight:400}
.cs-country{font-size:14px;color:#5f6368}
.cs-controls{padding:0 24px 48px;position:relative}
.cs-row{display:flex;justify-content:space-between;margin-bottom:38px}
.cs-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;color:#3c4043;width:72px;padding:0;position:relative}
.cs-btn .ic{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0002}
.cs-btn.active .ic{background:#d2e3fc}
.cs-btn.active{color:#1967d2}
.cs-btn span:last-child{font-size:13px}
.cs-end{align-self:center;width:72px;height:72px;border-radius:50%;background:#e8453c;border:0;display:flex;align-items:center;justify-content:center;margin:0 auto}
/* قائمة المزيد */
.cs-more-menu{position:absolute;bottom:106px;right:24px;background:#fff;border-radius:14px;box-shadow:0 2px 10px #0003;display:none;flex-direction:column;overflow:hidden;min-width:168px;z-index:2}
.cs-more-menu.show{display:flex}
.cs-more-menu button{border:0;background:#fff;padding:13px 16px;text-align:right;font-size:14.5px;color:#1f1f1f}
.cs-more-menu button:active{background:#f0f0f0}
.cs-more-menu button+button{border-top:1px solid #eee}
/* لوحة مفاتيح أثناء المكالمة */
.cs-keypad{display:none;flex-direction:column;align-items:center}
.callscreen.kp-open .cs-row,.callscreen.kp-open .cs-end{display:none}
.callscreen.kp-open .cs-keypad{display:flex}
.cs-kp-display{min-height:28px;font-size:26px;letter-spacing:2px;color:#1f1f1f;direction:ltr;margin-bottom:16px}
.cs-kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:272px;margin-bottom:20px}
.cs-kp-grid button{height:58px;border:0;border-radius:50%;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 1px 2px #0002;padding:0}
.cs-kp-grid button .num{font-size:22px}
.cs-kp-grid button small{font-size:10px;color:#777;margin-top:1px}
.cs-kp-hide{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;color:#3c4043}
.cs-kp-hide .ic{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px #0002}
</style>
</head>
<body>
<div class="phone view-dial" id="phone">
  <div class="contacts" id="contacts"></div>
  <div class="dial-area">
    <div class="display"><button class="erase" id="erase" aria-label="مسح"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#5f6368" d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg></button><input id="dial" aria-label="رقم الاتصال" readonly value=""></div>
    <div class="keypad" id="keypad"></div>
    <button class="call" id="call"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg><span>اتصال</span></button>
  </div>
  <div class="nav"><div class="nav-item active" id="tab-dial"><span class="nav-icon">⦿</span><span>لوحة المفاتيح</span></div><div class="nav-item" id="tab-home"><span class="nav-icon">⌂</span><span>الصفحة الرئيسية</span></div></div>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div id="loading"><div class="spin"></div><span>جارٍ تشغيل رمز USSD...</span></div>
    <h2>معلومات شركة الاتصالات</h2>
    <div class="message" id="message"></div>
    <input class="ussd-input" id="reply" inputmode="numeric" autocomplete="off" aria-label="الرد على رسالة الخدمة">
    <div class="actions"><button class="send" id="send">إرسال</button><button class="cancel" id="cancel">إلغاء</button></div>
  </section>
  <div class="callscreen" id="callscreen">
    <div class="cs-top">
      <div class="cs-status" id="csStatus">جارٍ الاتصال...</div>
      <div class="cs-number" id="csNumber"></div>
      <div class="cs-country">إسرائيل</div>
    </div>
    <div class="cs-controls" id="csControls">
      <div class="cs-row">
        <button class="cs-btn" id="csMore"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="5" r="2" fill="#3c4043"/><circle cx="12" cy="12" r="2" fill="#3c4043"/><circle cx="12" cy="19" r="2" fill="#3c4043"/></svg></span><span>المزيد</span></button>
        <button class="cs-btn" id="csSpeaker"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#3c4043" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span><span>مكبر الصوت</span></button>
        <button class="cs-btn" id="csMute"><span class="ic" id="csMuteIc"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#3c4043" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg></span><span>كتم</span></button>
        <button class="cs-btn" id="csPad"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22" fill="#3c4043"><circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/></svg></span><span>لوحة المفاتيح</span></button>
      </div>
      <button class="cs-end" id="csEnd" aria-label="إنهاء المكالمة"><svg viewBox="0 0 24 24" width="30" height="30" style="transform:rotate(135deg)"><path fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
      <div class="cs-more-menu" id="csMoreMenu">
        <button data-m="1">إضافة مكالمة</button>
        <button data-m="2">ملاحظة مكالمة</button>
        <button data-m="3">اتصال طارئ</button>
      </div>
      <div class="cs-keypad" id="csKeypad">
        <div class="cs-kp-display" id="csKpDisplay">&nbsp;</div>
        <div class="cs-kp-grid" id="csKpGrid"></div>
        <button class="cs-kp-hide" id="csKpHide"><span class="ic"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="#3c4043" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></span><span>إخفاء</span></button>
      </div>
    </div>
  </div>
</div>
<script>
const dial=document.getElementById('dial'), sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
const message=document.getElementById('message'), reply=document.getElementById('reply');
let baseH=0,baseW=0;
function sizePhone(){const ph=document.getElementById('phone');const W=innerWidth;baseW=W;baseH=innerHeight; /* الارتفاع الأصلي بدون لوحة المفاتيح */
 const narrow=W<=480;const k=narrow?W/360:baseH/800;
 ph.style.width=(narrow?W/k:360)+'px';ph.style.height=(baseH/k)+'px';
 ph.style.left=narrow?'0px':((W-360*k)/2)+'px';ph.style.transform='scale('+k+')';
 ph.dataset.k=k}
function updateKb(){const ph=document.getElementById('phone');const k=Number(ph.dataset.k)||1;
 const vv=window.visualViewport;const visH=vv?vv.height:innerHeight;
 ph.style.setProperty('--kb',(Math.max(0,baseH-visH)/k)+'px');scrollTo(0,0)}
/* نعيد حساب حجم الخلفية فقط عند تغيّر العرض (دوران الشاشة)؛ ظهور لوحة المفاتيح يغيّر الارتفاع فقط
   فنحرّك النافذة المنبثقة عبر --kb دون تحريك أو تصغير الخلفية */
function onResize(){if(innerWidth!==baseW)sizePhone();updateKb()}
addEventListener('resize',onResize);
if(window.visualViewport){window.visualViewport.addEventListener('resize',updateKb);window.visualViewport.addEventListener('scroll',updateKb)}
sizePhone();updateKb();
let stage=''; let destination=''; let app='pay';
/* نغمات DTMF */
let actx=null;
function dtmf(n){
 const f={'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],'6':[770,1477],'7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]}[n];
 if(!f)return;
 try{
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
  const t0=actx.currentTime,dur=.12,gain=actx.createGain();
  gain.gain.setValueAtTime(0,t0);gain.gain.linearRampToValueAtTime(.18,t0+.005);
  gain.gain.setValueAtTime(.18,t0+dur-.02);gain.gain.linearRampToValueAtTime(0,t0+dur);
  gain.connect(actx.destination);
  f.forEach(freq=>{const o=actx.createOscillator();o.type='sine';o.frequency.value=freq;o.connect(gain);o.start(t0);o.stop(t0+dur)});
 }catch(e){}
}
/* نغمة رنين الاتصال (محاكاة) */
let ringTimer=null,ringMuted=false,speakerOn=false;
function ringBeep(){
 if(ringMuted)return;
 try{
  if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended')actx.resume();
  const t0=actx.currentTime,dur=1,peak=speakerOn?.32:.16,g=actx.createGain();
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+.02);
  g.gain.setValueAtTime(peak,t0+dur-.05);g.gain.linearRampToValueAtTime(0,t0+dur);
  g.connect(actx.destination);
  const o=actx.createOscillator();o.type='sine';o.frequency.value=425;o.connect(g);o.start(t0);o.stop(t0+dur);
 }catch(e){}
}
function startRingback(){stopRingback();ringBeep();ringTimer=setInterval(ringBeep,4000)}
function stopRingback(){if(ringTimer){clearInterval(ringTimer);ringTimer=null}}
/* شاشة المكالمة */
const callscreen=document.getElementById('callscreen'),csNumber=document.getElementById('csNumber');
const csMore=document.getElementById('csMore'),csMoreMenu=document.getElementById('csMoreMenu');
const csMute=document.getElementById('csMute'),csMuteIc=document.getElementById('csMuteIc'),csSpeaker=document.getElementById('csSpeaker');
const csPad=document.getElementById('csPad'),csKpDisplay=document.getElementById('csKpDisplay');
const MIC_ON='<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#3c4043" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>';
const MIC_OFF='<svg viewBox="0 0 24 24" width="22" height="22"><path fill="#1967d2" d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>';
function fmtPhone(d){return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6)}
function closeMoreMenu(){csMoreMenu.classList.remove('show')}
function startCall(num){
 csNumber.textContent=fmtPhone(num);
 document.getElementById('csStatus').textContent='جارٍ الاتصال...';
 ringMuted=false;csMute.classList.remove('active');csMuteIc.innerHTML=MIC_ON;
 speakerOn=false;csSpeaker.classList.remove('active');
 callscreen.classList.remove('kp-open');closeMoreMenu();
 callscreen.classList.add('show');
 startRingback();
}
function endCall(){stopRingback();callscreen.classList.remove('show','kp-open');closeMoreMenu();dial.value=''}
document.getElementById('csEnd').onclick=endCall;
csMute.onclick=()=>{ringMuted=!ringMuted;csMute.classList.toggle('active',ringMuted);csMuteIc.innerHTML=ringMuted?MIC_OFF:MIC_ON};
csSpeaker.onclick=()=>{speakerOn=!speakerOn;csSpeaker.classList.toggle('active',speakerOn)};
csMore.onclick=e=>{e.stopPropagation();csMoreMenu.classList.toggle('show')};
csMoreMenu.querySelectorAll('button').forEach(b=>b.onclick=()=>{closeMoreMenu()});
callscreen.addEventListener('click',e=>{if(!csMoreMenu.contains(e.target)&&e.target!==csMore&&!csMore.contains(e.target))closeMoreMenu()});
/* لوحة مفاتيح أثناء المكالمة لإرسال نغمات DTMF */
const csKpGrid=document.getElementById('csKpGrid');
csPad.onclick=()=>{closeMoreMenu();csKpDisplay.textContent='';callscreen.classList.add('kp-open')};
document.getElementById('csKpHide').onclick=()=>callscreen.classList.remove('kp-open');

function fmt2(n){const s=Math.abs(n).toFixed(2);const p=s.split('.');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return (n<0?'-':'')+p.join('.')}
function pobTxns(){
 const days=20,out=[],now=new Date();
 for(let i=0;i<days;i++){
  const d=new Date(now);d.setDate(d.getDate()-i);
  const dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0'),yyyy=d.getFullYear();
  out.push(`1,800.00 تحويل .${dd}${mm}${yyyy}`);
 }
 return out;
}
function pobToOptions(){

  {key:'curUsd',label:`جاري-0 (${fmt2(pob.curUsd)}) دولار`}
 ];
 return all.filter(a=>a.key!==pobSrc);
}

function pobSend(v){
 const S=pobStage;
 if(S==='pin'){
  if(/^\d{4}$/.test(v)){pobStage='menu1';pobStack=[];pobRefresh()}
  else message.textContent='الرقم السري يجب أن يتكون من 4 أرقام';
  return;
 }
 if(S==='menu1'){
  if(v==='1')return pobGo('bal1');
  if(v==='2')return pobGo('stmtSel1');
  if(v==='3')return pobGo('transferType');
  if(v==='#')return pobGo('menu2');
  if(v==='0')return pobExit();
  return;
 }
 if(S==='menu2'){
  if(v==='4')return pobGo('esOperator');
  if(v==='5')return pobStub('هذه الخدمة غير متاحة حاليًا.');
  if(v==='6')return pobGo('payNumber');
  if(v==='#')return pobGo('menu3');
  if(v==='*')return pobBack();
  if(v==='0')return pobExit();
  return;
 }
 if(S==='menu3'){
  if(v==='7')return pobGo('pwdNew');
  if(v==='8')return pobGo('transCode');
  if(v==='9')return pobGo('lang');
  if(v==='10')return pobStub('محلي: 1700150150\nدولي: 00970022946420\nبنك فلسطين يشكركم');
  if(v==='*')return pobBack();
  if(v==='0')return pobExit();
  return;
 }
 if(S==='pwdNew'){
  if(/^\d{4}$/.test(v))return pobGo('pwdSuccess');
  message.textContent='الرقم السري يجب أن يتكون من 4 أرقام';
  return;
 }
 if(S==='transCode'){if(v)return pobGo('transCodeSuccess');return}
 if(S==='lang'){
  if(v==='1'||v==='2')return pobGo('langSuccess');
  if(v==='3')return pobOpen('menu1');
  return;
 }
 if(S==='bal1'){if(v==='#')return pobGo('bal2');if(v==='0')return pobExit();return}
 if(S==='bal2'){if(v==='0')return pobExit();return}
 if(S==='stmtSel1'){
  if(v==='1'||v==='2'){stmtPage=0;return pobGo('stmtList')}
  if(v==='#')return pobGo('stmtSel2');
  if(v==='0')return pobExit();
  return;
 }
 if(S==='stmtSel2'){if(v==='3'){stmtPage=0;return pobGo('stmtList')}if(v==='0')return pobExit();return}
 if(S==='stmtList'){
  const t=pobTxns();const more=(stmtPage+1)*2<t.length;
  if(v==='#'&&more)return pobPageNext();
  if(v==='0')return pobExit();
  return;
 }
 if(S==='transferType'){
  if(v==='1'){obFlow=false;return pobGo('from1')}
  if(v==='2'){obFlow=true;return pobGo('from1')}
  if(v==='*')return pobBack();
  if(v==='0')return pobExit();
  return;
 }
 if(S==='from1'){
  if(v==='1'){pobSrc='cur';return pobGo(obFlow?'obAmount':'amount')}
  if(v==='2'){pobSrc='sav';return pobGo(obFlow?'obAmount':'amount')}
  if(v==='#')return pobGo('from2');
  if(v==='0')return pobExit();
  return;
 }
 if(S==='from2'){
  if(v==='3'){pobSrc='curUsd';return pobGo(obFlow?'obAmount':'amount')}
  if(v==='0')return pobExit();
  return;
 }
 if(S==='amount'){const n=Number(v);if(v&&n>0){pobAmt=n;return pobGo('to')}return}
 if(S==='to'){
  const o=pobToOptions();let destKey=null;
  if(v==='1')destKey=o[0].key;else if(v==='2')destKey=o[1].key;
  if(destKey){
   if(pob[pobSrc]<pobAmt)return pobGo('insufficient');
   pob[pobSrc]=+(pob[pobSrc]-pobAmt).toFixed(2);pob[destKey]=+(pob[destKey]+pobAmt).toFixed(2);savePob();
   return pobGo('success');
  }
  if(v==='0')return pobExit();
  return;
 }
 if(S==='obAmount'){
  const n=Number(v);
  if(v&&n>0){
   if(pob[pobSrc]<n)return pobGo('insufficient');
   pob[pobSrc]=+(pob[pobSrc]-n).toFixed(2);savePob();
   return pobGo('success');
  }
  return;
 }
 if(S==='esOperator'){
  if(v==='1'||v==='2')return pobStub('هذه الخدمة غير متاحة حاليًا.');
  if(v==='*')return pobBack();
  if(v==='0')return pobExit();
  return;
 }
 if(S==='payNumber'){
  if(v){
   payPhone=v;
   const norm=normalize(v);
   const c=allContacts.find(ct=>normalize(ct.phone)===norm);
   payName=c?c.name:'مستخدم بال باي';
   return pobGo('payName');
  }
  return;
 }
 if(S==='payName'){
  if(v==='1')return pobGo('payAmount');
  if(v==='0')return pobExit();
  return;
 }
 if(S==='payAmount'){const n=Number(v);if(v&&n>0){payAmt=n;return pobGo('payFrom')}return}
 if(S==='payFrom'){
  if(v==='1'||v==='2'){
   const src=v==='1'?'cur':'sav';
   if(pob[src]<payAmt)return pobGo('insufficient');
   paySrc=src;return pobGo('payConfirm');
  }
  if(v==='0')return pobExit();
  return;
 }
 if(S==='payConfirm'){
  if(v){
   if(pob[paySrc]<payAmt)return pobGo('insufficient');
   pob[paySrc]=+(pob[paySrc]-payAmt).toFixed(2);savePob();
   return pobGo('paySuccess');
  }
  return;
 }
}

}
let amount='1',flow='friend';
const INIT=12750,DAY=864e5;let bal={balance:INIT,since:null};
try{const r=JSON.parse(localStorage.getItem('ussdBal')||'null');if(r&&typeof r.balance==='number')bal=r}catch(e){}
function saveBal(){try{localStorage.setItem('ussdBal',JSON.stringify(bal))}catch(e){}}
function getBal(){if(bal.since&&Date.now()-bal.since>=DAY){bal={balance:INIT,since:null};saveBal()}return bal.balance}
function deduct(n){getBal();bal.balance-=n;if(!bal.since)bal.since=Date.now();saveBal()}
getBal();
document.getElementById('send').onclick=()=>{
 if(timer)return;
 const v=reply.value.trim();
 if(app==='pob'){pobSend(v);return}
 if(stage==='menu'){if(v==='1'){flow='friend';stage='pin'}else if(v==='2'){flow='merchant';stage='pin'}else if(v==='3')stage='balance';else return}
 else if(stage==='pin'){if(v==='00')stage='menu';else if(/^\d{4}$/.test(v))stage=flow==='friend'?'transfer-phone':'merchant';else {message.textContent='الرقم السري يجب أن يتكون من 4 أرقام';return}}
 else if(stage==='transfer-phone'||stage==='merchant'){if(v==='00')stage='menu';else if(v){destination=v;stage='transfer-amount'}else return}
 else if(stage==='transfer-amount'){if(v==='00')stage='menu';else if(v&&Number(v)>0){if(Number(v)>getBal())stage='insufficient';else{amount=String(Number(v));stage='transfer-confirm'}}else return}
 else if(stage==='transfer-confirm'){if(v==='1'){deduct(Number(amount));stage='success'}else if(v==='2')stage='menu';else return}
 reply.value='';busy(()=>{render();setTimeout(()=>reply.focus({preventScroll:true}),100)});
};
document.getElementById('cancel').onclick=()=>{if(timer)return;if(app==='pob'){pobExit();return}if(stage==='balance'||stage==='success'||stage==='insufficient'||stage==='invalid'){closeStage();document.querySelector('.ussd-input').style.display='block';document.querySelector('.actions').style.display='flex';dial.value=''}else closeStage()};
scrim.onclick=()=>{if(!timer)closeStage()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStage();if(e.key==='Enter'&&sheet.classList.contains('show')){const s=document.getElementById('send');if(s.style.display!=='none')s.click();else document.getElementById('cancel').click()}});
</script>
</body>
