<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e9edf7">
<title>محاكاة خدمة USSD</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:Cairo;src:local("Cairo")}*{box-sizing:border-box}
:root{--blue:#1685f7;--bg:#e9edf7;--ink:#202124;--green:#208b43}
html,body{margin:0;width:100%;height:100%;font-family:Cairo,"Noto Sans Arabic",Arial,sans-serif;background:#e9edf7;color:var(--ink);overflow:hidden}
button,input{font:inherit} .phone{height:100dvh;max-width:480px;margin:auto;position:relative;background:#e9edf7;overflow:hidden}
.contacts{position:absolute;top:16px;left:16px;right:16px;bottom:82px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}.contact{flex:0 0 auto}.suggested{font-size:18px;color:#2462a5;text-align:right;padding:8px 10px 24px}.contact{height:100px;background:#fff;border-radius:22px 22px 7px 7px;display:flex;align-items:center;gap:16px;padding:14px 20px;direction:rtl}.avatar{width:76px;height:76px;flex:0 0 76px;border-radius:50%;background:#79d68e;display:grid;place-items:center;font-size:30px;color:#174d2b}.contact-info{flex:1;text-align:right;min-width:0}.contact-name{font-size:23px;white-space:nowrap}.contact-phone{font-size:19px;color:#666;white-space:nowrap}.num-ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}.phone-icon{font-size:27px;color:#444}.dial-area{position:absolute;left:0;right:0;bottom:28px;height:70%;background:#e9edf7;border-radius:34px 34px 0 0;padding:16px 14px 118px}
.display{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 10px}
#dial{width:100%;background:transparent;border:0;outline:0;text-align:center;font-size:30px;color:#171717;direction:ltr}
.erase{font-size:27px;color:#62666c;border:0;background:transparent;padding:6px}
.keypad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:clamp(64px,9.7vh,91px);border:0;border-radius:60px;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:none}
.key .num{font-family:Arial,sans-serif;font-size:clamp(28px,6vw,42px);line-height:1.15}
.key small{font-size:15px;color:#3b3b3b;margin-top:3px}
.call{display:block;margin:24px auto 0;width:198px;height:76px;border:0;border-radius:50px;background:#208b43;color:white;font-size:20px}
.nav{position:absolute;bottom:0;height:82px;left:0;right:0;display:flex;align-items:center;justify-content:space-around;color:#555;background:#e9edf7;border-top:1px solid #d1d6e1}.nav .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:16px}.nav .nav-icon{font-size:26px;color:#42464c}.nav .active{color:#2d7ba6}.nav .active .nav-icon{background:#c8eaff;border-radius:30px;padding:4px 24px}
.nav span{font-size:20px;opacity:.7}
.scrim{position:absolute;inset:0;background:#0005;display:none;z-index:4}
.sheet{position:absolute;z-index:5;bottom:0;left:0;right:0;background:#fff;border-radius:32px 32px 0 0;padding:28px 28px max(30px,env(safe-area-inset-bottom));display:none;box-shadow:0 -2px 14px #0001}
.sheet.show{display:block}.scrim.show{display:block}
.sheet h2{font-size:24px;font-weight:500;text-align:center;margin:18px 0 38px;color:#111}
.message{font-size:23px;line-height:1.55;text-align:right;white-space:pre-line;color:#414141;min-height:44px;margin-bottom:24px}
.ussd-input{width:100%;height:86px;border:3px solid var(--blue);border-radius:34px;background:#f0f0f0;outline:0;text-align:right;padding:0 18px;font-size:24px;direction:ltr;margin-bottom:28px}
.actions{display:flex;gap:14px;direction:ltr}
.actions button{height:58px;border:0;border-radius:40px;flex:1;font-size:23px}
.send{background:var(--blue);color:white}.cancel{background:#f0f0f0;color:#333}
.ok{width:100%;background:var(--blue);color:white;border:0;border-radius:40px;height:58px;font-size:23px}
.view-home .dial-area{display:none}.view-dial .contacts{pointer-events:none}.nav-item{cursor:pointer}.contact{cursor:pointer}.empty{padding:20px;text-align:center;color:#666}
#loading{display:none;align-items:center;gap:16px;padding:0 4px 28px;font-size:19px;color:#222;direction:rtl;border-bottom:1px solid #dcdfe4}
.sheet.busy{padding:30px 15px 48px!important;border-radius:28px 28px 0 0}
.sheet.busy>*:not(#loading){display:none!important}.sheet.busy #loading{display:flex}
.spin{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:3px solid #222;position:relative;animation:pl 1.1s ease-in-out infinite}
.spin:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#222}
@keyframes pl{50%{opacity:.4}}
.sheet.final{padding:28px 26px 70px!important;border-radius:28px 28px 0 0}
.sheet.final h2{font-size:18px;line-height:1.5;margin:0 0 13px}
.sheet.final .message{text-align:center;font-size:19px;line-height:1.55;min-height:0;margin:0 0 26px}
.sheet.final .hint{display:none}
.sheet.final .actions{margin:0}.sheet.final .cancel{background:var(--blue);color:#fff;height:46px;font-size:17px;border-radius:30px}
.hint{font-size:12px;text-align:center;color:#6b6b6b;margin-top:12px}
@media(max-height:700px){.dial-area{height:72%;padding-bottom:100px}.contacts{top:12px}.contact{height:76px}.avatar{width:54px;height:54px;flex-basis:54px}.contact-name{font-size:18px}.contact-phone{font-size:15px}.key{height:54px}.call{height:58px;margin-top:14px}.sheet{padding-top:14px}.sheet h2{margin:10px 0 20px}.message{font-size:19px;margin-bottom:14px}.ussd-input{height:64px;margin-bottom:18px}.actions button,.ok{height:50px}}
</style>
</head>
<body>
<div class="phone view-dial" id="phone">
  <div class="contacts" id="contacts"></div>
  <div class="dial-area">
    <div class="display"><button class="erase" id="erase" aria-label="مسح">⌫</button><input id="dial" aria-label="رقم الاتصال" readonly value=""></div>
    <div class="keypad" id="keypad"></div>
    <button class="call" id="call">اتصال</button>
  </div>
  <div class="nav"><div class="nav-item active" id="tab-dial"><span class="nav-icon">⦿</span><span>لوحة المفاتيح</span></div><div class="nav-item" id="tab-home"><span class="nav-icon">⌂</span><span>الصفحة الرئيسية</span></div></div>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div id="loading"><div class="spin"></div><span>جارٍ تشغيل رمز USSD...</span></div>
    <h2>معلومات شركة الاتصالات</h2>
    <div class="message" id="message"></div>
    <input class="ussd-input" id="reply" inputmode="numeric" autocomplete="off" aria-label="الرد على رسالة الخدمة">
    <div class="actions"><button class="send" id="send">إرسال</button><button class="cancel" id="cancel">إلغاء</button></div
  </section>
</div>
<script>
const dial=document.getElementById('dial'), sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
const message=document.getElementById('message'), reply=document.getElementById('reply');
let stage=''; let destination='';
const keys=[['1','๑๑'],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];
const keypad=document.getElementById('keypad');
keys.forEach(([n,s])=>{const b=document.createElement('button');b.className='key';b.innerHTML=`<span class="num">${n}</span><small>${s||'&nbsp;'}</small>`;b.onclick=()=>{dial.value+=n};keypad.appendChild(b)});
document.getElementById('erase').onclick=()=>dial.value=dial.value.slice(0,-1);
document.getElementById('call').onclick=()=>{const v=dial.value.trim();if(v==='*110#')openStage('menu');else if(v)openStage('invalid')};
const allContacts=[
 {name:'هاني اللبناني',phone:'059-505-6531',label:'الجوال',color:'#79d68e',fg:'#174d2b',ch:'ه'},
 {name:'المصطفاوي',phone:'+972592593423',label:'الجوال',color:'#d7dce7',fg:'#333',ch:'م'},
 {name:'أحمد الخطيب',phone:'059-526-0181',label:'الجوال',color:'#f6c177',fg:'#5a3b0a',ch:'أ'},
 {name:'سامي أبو شمالة',phone:'0595908301',label:'الجوال',color:'#9ecbff',fg:'#0c3b6b',ch:'س'},
 {name:'محمد عطية',phone:'0596613186',label:'الجوال',color:'#f4a6b8',fg:'#6b1230',ch:'م'},
 {name:'يوسف النجار',phone:'059-091-3909',label:'الجوال',color:'#b9e4a6',fg:'#24531a',ch:'ي'},
 {name:'خالد العلمي',phone:'0599603082',label:'الجوال',color:'#d2b8f2',fg:'#3e1b6b',ch:'خ'},
 {name:'ليلى حسونة',phone:'0594628194',label:'الجوال',color:'#8fd9d2',fg:'#0b4a45',ch:'ل'},
 {name:'رامي الشوا',phone:'059-821-9935',label:'الجوال',color:'#f6c177',fg:'#5a3b0a',ch:'ر'},
 {name:'نور الهدى',phone:'0591819093',label:'الجوال',color:'#9ecbff',fg:'#0c3b6b',ch:'ن'},
 {name:'عمر البرغوثي',phone:'0597865797',label:'الجوال',color:'#f4a6b8',fg:'#6b1230',ch:'ع'},
 {name:'سارة المصري',phone:'059-543-2319',label:'الجوال',color:'#b9e4a6',fg:'#24531a',ch:'س'},
 {name:'إبراهيم دحلان',phone:'0594875749',label:'الجوال',color:'#d2b8f2',fg:'#3e1b6b',ch:'إ'},
 {name:'هبة القدوة',phone:'0591186252',label:'الجوال',color:'#8fd9d2',fg:'#0b4a45',ch:'ه'},
 {name:'طارق الحداد',phone:'059-760-1895',label:'الجوال',color:'#f6c177',fg:'#5a3b0a',ch:'ط'},
 {name:'دانا سلامة',phone:'0595597971',label:'الجوال',color:'#9ecbff',fg:'#0c3b6b',ch:'د'},
 {name:'ماهر أبو عودة',phone:'0591471049',label:'الجوال',color:'#f4a6b8',fg:'#6b1230',ch:'م'},
 {name:'رنا الأغا',phone:'059-746-5075',label:'الجوال',color:'#b9e4a6',fg:'#24531a',ch:'ر'},
 {name:'باسل شاهين',phone:'0592917034',label:'الجوال',color:'#d2b8f2',fg:'#3e1b6b',ch:'ب'},
 {name:'ياسمين زقوت',phone:'0592366712',label:'الجوال',color:'#8fd9d2',fg:'#0b4a45',ch:'ي'},
 {name:'وسام العجرمي',phone:'059-768-4268',label:'الجوال',color:'#f6c177',fg:'#5a3b0a',ch:'و'},
 {name:'ثائر مطر',phone:'0594656321',label:'الجوال',color:'#9ecbff',fg:'#0c3b6b',ch:'ث'}
];
function normalize(p){let d=p.replace(/\D/g,'');if(d.startsWith('972'))d='0'+d.slice(3);return d}
const isMatch=c=>/^059\d{7}$/.test(normalize(c.phone));
function renderContacts(){
 const box=document.getElementById('contacts');box.innerHTML='<div class="suggested">مقترحة</div>';
 const list=allContacts.filter(isMatch);
 if(!list.length){box.insertAdjacentHTML('beforeend','<div class="empty">لا توجد جهات اتصال</div>');return}
 list.forEach(c=>{const d=document.createElement('div');d.className='contact';
  d.innerHTML=`<div class="avatar" style="background:${c.color};color:${c.fg}">${c.ch}</div><div class="contact-info"><div class="contact-name">${c.name}</div><div class="contact-phone">${c.label} <span class="num-ltr">${c.phone}</span></div></div><svg class="phone-icon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="#444" d="M6.54 5c.06.89.21 1.76.45 2.59l-1.2 1.2c-.41-1.2-.67-2.47-.76-3.79h1.51m9.86 12.02c.85.24 1.72.39 2.6.45v1.49c-1.32-.09-2.59-.35-3.8-.75l1.2-1.19M7.5 3H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.49c0-.55-.45-1-1-1-1.24 0-2.45-.2-3.57-.57-.1-.04-.21-.05-.31-.05-.26 0-.51.1-.71.29l-2.2 2.2c-2.83-1.45-5.15-3.76-6.59-6.59l2.2-2.2c.28-.28.36-.67.25-1.02C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1z"/></svg>`;
  d.onclick=()=>{dial.value=normalize(c.phone);showTab('dial')};box.appendChild(d)});
}
function showTab(t){
 document.getElementById('phone').className='phone view-'+t;
 document.getElementById('tab-dial').classList.toggle('active',t==='dial');
 document.getElementById('tab-home').classList.toggle('active',t==='home');
}
document.getElementById('tab-dial').onclick=()=>showTab('dial');
document.getElementById('tab-home').onclick=()=>showTab('home');
renderContacts();
let timer=null;
function busy(fn){sheet.classList.add('show','busy');scrim.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>{timer=null;sheet.classList.remove('busy');fn()},1300)}
function openStage(s){stage=s;reply.value='';busy(()=>{render();setTimeout(()=>reply.focus(),100)})}
function closeStage(){clearTimeout(timer);timer=null;sheet.classList.remove('show','busy','final');scrim.classList.remove('show');reply.value='';}
function render(){
 let text='';
 if(stage==='menu')text='محفظة جوال باي\n1. التحويل لصديق\n2. الدفع لتاجر\n3. فحص الرصيد';
 else if(stage==='balance'){text='الرصيد الحالي : '+getBal();document.querySelector('.ussd-input').style.display='none';document.querySelector('.actions').style.display='flex';}
 else if(stage==='transfer-phone')text='ادخل رقم محفظة الصديق المراد التحويل له\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='transfer-amount')text=(flow==='friend'?'ادخل المبلغ المراد تحويله':'ادخل المبلغ المراد تحويله')+'\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='transfer-confirm')text=(flow==='friend'?`سيتم تحويل ${amount} شيقل إلى \u2066${destination}\u2069`:`سيتم دفع ${amount} شيقل إلى التاجر \u2066${destination}\u2069`)+'\n1. للتأكيد\n2. للإلغاء';
 else if(stage==='merchant')text='ادخل رقم التاجر المراد التحويل له\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='pin')text='ادخل الرقم السري (4 أرقام)\n00. الرجوع إلى القائمة الرئيسية';
 else if(stage==='success'){text='تم تحويل المبلغ بنجاح';document.querySelector('.ussd-input').style.display='none';document.querySelector('.actions').style.display='flex';}
 else if(stage==='invalid')text='الرمز غير معروف .\nاكتب *110# لفتح القائمة.';
 else text='أدخل الاختيار';
 message.textContent=text;
 sheet.classList.toggle('final',stage==='balance'||stage==='success');
 if(stage!=='balance'&&stage!=='success'){document.querySelector('.ussd-input').style.display='block'}
 document.getElementById('send').style.display=(stage==='balance'||stage==='success')?'none':'block';
 document.getElementById('cancel').textContent=(stage==='balance'||stage==='success')?'حسنًا':'إلغاء';
}
let amount='1',flow='friend';
const INIT=12750,DAY=864e5;let bal={balance:INIT,since:null};
try{const r=JSON.parse(localStorage.getItem('ussdBal')||'null');if(r&&typeof r.balance==='number')bal=r}catch(e){}
function saveBal(){try{localStorage.setItem('ussdBal',JSON.stringify(bal))}catch(e){}}
function getBal(){if(bal.since&&Date.now()-bal.since>=DAY){bal={balance:INIT,since:null};saveBal()}return bal.balance}
function deduct(n){getBal();bal.balance-=n;if(!bal.since)bal.since=Date.now();saveBal()}
getBal();
document.getElementById('send').onclick=()=>{
 if(timer)return;
 const v=reply.value.trim();
 if(stage==='menu'){if(v==='1'){flow='friend';stage='pin'}else if(v==='2'){flow='merchant';stage='pin'}else if(v==='3')stage='balance';else return}
 else if(stage==='pin'){if(v==='00')stage='menu';else if(/^\d{4}$/.test(v))stage=flow==='friend'?'transfer-phone':'merchant';else {message.textContent='الرقم السري يجب أن يتكون من 4 أرقام';return}}
 else if(stage==='transfer-phone'||stage==='merchant'){if(v==='00')stage='menu';else if(v){destination=v;stage='transfer-amount'}else return}
 else if(stage==='transfer-amount'){if(v==='00')stage='menu';else if(v&&Number(v)>0){if(Number(v)>getBal()){message.textContent='الرصيد غير كافٍ. رصيدك الحالي '+getBal();return}amount=String(Number(v));stage='transfer-confirm'}else return}
 else if(stage==='transfer-confirm'){if(v==='1'){deduct(Number(amount));stage='success'}else if(v==='2')stage='menu';else return}
 else if(stage==='invalid'){stage='menu'}
 reply.value='';busy(()=>{render();setTimeout(()=>reply.focus(),100)});
};
document.getElementById('cancel').onclick=()=>{if(timer)return;if(stage==='balance'||stage==='success'){closeStage();document.querySelector('.ussd-input').style.display='block';document.querySelector('.actions').style.display='flex';dial.value=''}else closeStage()};
scrim.onclick=()=>{if(!timer)closeStage()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeStage();if(e.key==='Enter'&&sheet.classList.contains('show'))document.getElementById('send').click()});
</script>
</body>
</html>
